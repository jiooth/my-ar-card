<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Buttons ka container screen ke neeche center mein rahega */
      .button-container {
        position: absolute;
        bottom: 8%;
        left: 50%;
        transform: translateX(-50%);
        display: none; /* Shuru mein chhupa rahega, scan hone par dikhega */
        flex-direction: column;
        gap: 10px;
        z-index: 999;
        width: 220px;
      }

      /* Buttons ki sundar styling */
      .ar-btn {
        padding: 12px 20px;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
      }

      .btn-call { background-color: #2baf55; }
      .btn-whatsapp { background-color: #25D366; }
      .btn-web { background-color: #007AFF; }
    </style>
  </head>
  <body>

    <!-- Teenon Buttons ka Container -->
    <div id="btn-group" class="button-container">
      <button id="call-btn" class="ar-btn btn-call">📞 Call Me</button>
      <button id="wa-btn" class="ar-btn btn-whatsapp">💬 WhatsApp</button>
      <button id="web-btn" class="ar-btn btn-web">🌐 Visit Website</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <!-- Video file ko load karne ke liye assets zone -->
      <a-assets>
        <video id="card-video" src="./videoplayback.mp4" preload="auto" loop="true" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target milne par kya dikhana hai -->
      <a-entity id="my-target" mindar-image-target="targetIndex: 0">
        <!-- Photo ke upar video chalegi (Aap iska width aur height video ke hisab se badal sakte hain) -->
        <a-video src="#card-video" width="1" height="0.56" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

    </a-scene>

    <script>
      const targetEntity = document.querySelector('#my-target');
      const btnGroup = document.querySelector('#btn-group');
      const videoElement = document.querySelector('#card-video');
      
      const callBtn = document.querySelector('#call-btn');
      const waBtn = document.querySelector('#wa-btn');
      const webBtn = document.querySelector('#web-btn');

      // Jaise hi photo scan hogi: video chalegi aur buttons dikhenge
      targetEntity.addEventListener("targetFound", event => {
        videoElement.play();
        btnGroup.style.display = "flex";
      });

      // Jaise hi camera hatega: video pause aur buttons chhip jayenge
      targetEntity.addEventListener("targetLost", event => {
        videoElement.pause();
        btnGroup.style.display = "none";
      });

      // 1. Call Button Action
      callBtn.addEventListener("click", () => {
        window.location.href = "tel:+918129848820"; // Apna phone number dalein
      });

      // 2. WhatsApp Button Action (iFrame se bahar nikalne ke liye _top)
      waBtn.addEventListener("click", () => {
        window.open("https://wa.me/918129848820", "_top"); // Apna WhatsApp number dalein
      });

      // 3. Website Button Action
      webBtn.addEventListener("click", () => {
        window.open("https://surabhkranti.blogspot.com/2026/04/images.html"); // Apna blog/website link dalein
      });
    </script>
  </body>
</html>
