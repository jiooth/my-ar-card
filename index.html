<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* Buttons ko ek sath ek box mein rakhne ke liye container */
      .button-container {
        position: absolute;
        bottom: 12%;
        left: 50%;
        transform: translateX(-50%);
        display: none; /* Shuru mein chhupa rahega */
        flex-direction: column;
        gap: 12px; /* Dono buttons ke beech ki doori */
        z-index: 999;
        width: 200px;
      }

      /* Dono buttons ka common style */
      .ar-btn {
        padding: 12px 20px;
        color: white;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      /* Call button ka alag rang (Green) */
      .btn-call {
        background-color: #25D366;
      }

      /* Website button ka alag rang (Blue/Professional) */
      .btn-web {
        background-color: #007AFF;
      }
    </style>
  </head>
  <body>

    <!-- Dono Buttons ka Container -->
    <div id="btn-group" class="button-container">
      <button id="call-btn" class="ar-btn btn-call">📞 Call Me</button>
      <button id="web-btn" class="ar-btn btn-web">🌐 Visit Website</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="my-target" mindar-image-target="targetIndex: 0">
        <!-- Photo ke upar dikhne wali ring -->
        <a-ring color="#007AFF" radius-inner="0.4" radius-outer="0.45" position="0 0 0.1"
                animation="property: scale; to: 1.1 1.1 1.1; dur: 1200; dir: alternate; loop: true"></a-ring>
      </a-entity>
    </a-scene>

    <script>
      const targetEntity = document.querySelector('#my-target');
      const btnGroup = document.querySelector('#btn-group');
      const callBtn = document.querySelector('#call-btn');
      const webBtn = document.querySelector('#web-btn');

      // Target milne par dono buttons dikhein
      targetEntity.addEventListener("targetFound", event => {
        btnGroup.style.display = "flex";
      });

      // Target hatne par buttons chhup jayein
      targetEntity.addEventListener("targetLost", event => {
        btnGroup.style.display = "none";
      });

      // Call button ka kaam
      callBtn.addEventListener("click", () => {
        window.location.href = "tel:+918129848820"; // Yahan apna number daalein
      });

      // Website button ka kaam
      webBtn.addEventListener("click", () => {
        window.location.href = "https://surabhkranti.blogspot.com/2026/04/images.html?zx=a1844619f6b7bcdf"; // Yahan apni website ya blog ka link daalein
      });
    </script>
  </body>
</html>
